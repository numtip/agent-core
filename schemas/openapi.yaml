openapi: 3.1.0
info:
  title: Agent Core API
  version: 0.2.0
  description: Shared AI decision, routing, context, QA and observability API.
servers:
  - url: https://agent.example.com
components:
  securitySchemes:
    ProjectId:
      type: apiKey
      in: header
      name: x-agent-project
    ProjectToken:
      type: apiKey
      in: header
      name: x-agent-project-token
  schemas:
    DecisionType:
      type: string
      enum: [TASK_ROUTE, CONTEXT_ROUTE, TOOL_ROUTE, MODEL_ROUTE, SUBAGENT_ROUTE, NEXT_ACTION, QA_DISPOSITION, HUMAN_ESCALATION]
    DecisionRequest:
      type: object
      additionalProperties: false
      required: [project, decision_type, state, question]
      properties:
        project: {type: string, minLength: 1}
        task_id: {type: string}
        decision_type: {$ref: "#/components/schemas/DecisionType"}
        state: {type: object, additionalProperties: true}
        question:
          type: object
          required: [type, instructions]
          properties:
            type: {type: string, enum: [choice, noul, score]}
            instructions: {type: string}
            criteria: {type: object, additionalProperties: {type: string}}
            true_when: {type: string}
            false_when: {type: string}
            levels: {type: array, items: {type: string}}
        fallback_result: {type: string}
    DecisionResponse:
      type: object
      required: [decision_type, result, confidence, fallback, disposition]
      properties:
        decision_type: {$ref: "#/components/schemas/DecisionType"}
        result: {type: string}
        confidence: {type: number, minimum: 0, maximum: 1}
        reason_code: {type: [string, "null"]}
        fallback: {type: boolean}
        disposition: {type: string, enum: [EXECUTE, REVIEW, FALLBACK]}
        provider_request_id: {type: [string, "null"]}
security:
  - ProjectId: []
    ProjectToken: []
paths:
  /v1/health:
    get:
      security: []
      summary: Runtime health check
      responses:
        "200": {description: Healthy}
  /v1/decision:
    post:
      summary: Request a bounded structured decision
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DecisionRequest"}
      responses:
        "200":
          description: Decision result
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DecisionResponse"}
        "400": {description: Invalid request}
        "401": {description: Unauthorized}
        "403": {description: Forbidden or project mismatch}
        "429": {description: Rate limited}
        "503": {description: No safe decision available}
  /v1/route:
    post:
      summary: Route a task through the bounded decision contract
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DecisionRequest"}
      responses:
        "200": {description: Route result}
  /v1/qa:
    post:
      summary: Decide QA disposition
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DecisionRequest"}
      responses:
        "200": {description: QA result}
  /v1/context:
    post:
      summary: Select bounded task-specific context candidates
      responses:
        "200": {description: Ranked context candidates}
  /v1/subagent:
    post:
      summary: Plan a policy-gated deduplicated subagent task
      responses:
        "200": {description: Subagent plan}
  /v1/subagent/complete:
    post:
      summary: Mark an active subgoal complete
      responses:
        "200": {description: Completion recorded}
  /v1/advanced-route:
    post:
      summary: Apply security, complexity and cost-aware execution routing
      responses:
        "200": {description: Advanced route result}
  /v1/projects:
    get:
      summary: List registered project profiles
      responses:
        "200": {description: Project registry}
  /v1/metrics:
    get:
      summary: Return project-authenticated platform metrics
      responses:
        "200": {description: Metrics snapshot}
  /control:
    get:
      security: []
      summary: Human control center; protect with Cloudflare Access
      responses:
        "200": {description: HTML control center}
  /v1/control-metrics:
    get:
      security: []
      summary: Metrics for Cloudflare-Access-protected human control center
      responses:
        "200": {description: Metrics snapshot}
