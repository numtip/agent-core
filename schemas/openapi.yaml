openapi: 3.1.0
info:
  title: Agent Core API
  version: 0.1.0
  description: Shared bounded-decision infrastructure API.
servers:
  - url: https://agent.example.com
paths:
  /v1/health:
    get:
      operationId: health
      summary: Runtime health check
      responses:
        "200":
          description: Healthy

  /v1/decision:
    post:
      operationId: decision
      summary: Request a bounded structured decision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionRequest"
      responses:
        "200":
          description: Decision result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionResponse"
        "400":
          description: Invalid request
        "503":
          description: No safe decision or fallback is available

  /v1/route:
    post:
      operationId: route
      summary: Route a task using the bounded decision contract
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionRequest"
      responses:
        "200":
          description: Route decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionResponse"

  /v1/qa:
    post:
      operationId: qaDisposition
      summary: Decide QA disposition from structured state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionRequest"
      responses:
        "200":
          description: QA decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionResponse"

components:
  schemas:
    DecisionType:
      type: string
      enum:
        - TASK_ROUTE
        - CONTEXT_ROUTE
        - TOOL_ROUTE
        - MODEL_ROUTE
        - SUBAGENT_ROUTE
        - NEXT_ACTION
        - QA_DISPOSITION
        - HUMAN_ESCALATION

    ChoiceQuestion:
      type: object
      additionalProperties: false
      required: [type, instructions, criteria]
      properties:
        type:
          const: choice
        instructions:
          type: string
          minLength: 1
        criteria:
          type: object
          minProperties: 2
          additionalProperties:
            type: string
            minLength: 1

    NoulQuestion:
      type: object
      additionalProperties: false
      required: [type, instructions, true_when, false_when]
      properties:
        type:
          const: noul
        instructions:
          type: string
          minLength: 1
        true_when:
          type: string
          minLength: 1
        false_when:
          type: string
          minLength: 1

    ScoreQuestion:
      type: object
      additionalProperties: false
      required: [type, instructions, levels]
      properties:
        type:
          const: score
        instructions:
          type: string
          minLength: 1
        levels:
          type: array
          minItems: 2
          maxItems: 6
          items:
            type: string
            minLength: 1

    Question:
      oneOf:
        - $ref: "#/components/schemas/ChoiceQuestion"
        - $ref: "#/components/schemas/NoulQuestion"
        - $ref: "#/components/schemas/ScoreQuestion"

    DecisionRequest:
      type: object
      additionalProperties: false
      required: [project, decision_type, state, question]
      properties:
        project:
          type: string
          minLength: 1
        task_id:
          type: string
          minLength: 1
        decision_type:
          $ref: "#/components/schemas/DecisionType"
        state:
          type: object
          additionalProperties: true
        question:
          $ref: "#/components/schemas/Question"
        fallback_result:
          type: string
          minLength: 1

    DecisionResponse:
      type: object
      additionalProperties: false
      required:
        - decision_type
        - result
        - confidence
        - reason_code
        - fallback
        - disposition
        - provider_request_id
      properties:
        decision_type:
          $ref: "#/components/schemas/DecisionType"
        result:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
        reason_code:
          type: [string, "null"]
        fallback:
          type: boolean
        disposition:
          type: string
          enum: [EXECUTE, REVIEW, FALLBACK]
        provider_request_id:
          type: [string, "null"]
